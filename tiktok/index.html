<!doctype html><html lang="en"><head><meta charset="utf-8"><title>StarCoded Poster — TikTok login callback</title><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><style>body{font-family:-apple-system,Helvetica,Arial,sans-serif;background:#0b0b10;color:#f5f5f7;margin:0;padding:40px 20px;max-width:720px;margin:auto}h1{color:#e4c990;font-size:22px}code{display:block;background:#1c1c22;padding:16px;border-radius:12px;word-break:break-all;font-size:15px;margin:12px 0}button{background:#e4c990;color:#0b0b10;border:0;padding:12px 18px;border-radius:10px;font-size:16px;font-weight:600}small{color:#8e8e93}</style></head><body><h1>TikTok authorization received</h1><p>Copy the code below, then in Terminal run:<br><code>./.venv/bin/python scripts/social_post.py tiktok-exchange</code>and paste it at the hidden prompt. Close this tab afterwards. The code expires in a few minutes.</p><p><strong>code</strong></p><code id="code">(no code in the URL)</code><button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy code</button><p><small>state: <span id="state">—</span> · error: <span id="err">none</span></small></p><script>const q=new URLSearchParams(location.search);if(q.get('code')){document.getElementById('code').textContent=q.get('code');}document.getElementById('state').textContent=q.get('state')||'—';document.getElementById('err').textContent=q.get('error')?q.get('error')+' — '+(q.get('error_description')||''):'none';</script></body></html>
